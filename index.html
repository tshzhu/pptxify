<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Convert Beamer PDF pages to a high-resolution, image-based PPTX in your browser."
    />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="icon" href="./icons/favicon.ico" sizes="any" />
    <link rel="manifest" href="./icons/site.webmanifest" />
    <title>PPTXify - Convert PDF to image-based PPTX</title>
  </head>
  <body>
    <main class="app-shell">
      <a
        id="github-link"
        class="github-link"
        href="https://github.com/tshzhu/pptxify"
        target="_blank"
        rel="noreferrer"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.26c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.62-2.8 5.65-5.48 5.95.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5" />
        </svg>
      </a>

      <div class="converter-content">
        <header class="site-header">
          <h1>PPTXify</h1>
          <p>Convert each PDF page to a high-resolution image slide.</p>
        </header>

      <section class="converter-card" aria-label="PDF to PPTX converter">
        <div id="drop-zone" class="file-picker" tabindex="0" role="button" aria-describedby="drop-help">
          <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
          <div class="file-picker-mark" aria-hidden="true">＋</div>
          <div class="file-picker-title">Choose a PDF</div>
          <div id="drop-help" class="file-picker-help">Drop it here or browse your files</div>
          <button id="choose-file" class="button button-outline" type="button">Upload PDF</button>
        </div>

        <div id="file-summary" class="file-summary hidden" aria-live="polite">
          <div class="file-summary-icon" aria-hidden="true">PDF</div>
          <div class="file-summary-content">
            <div id="file-name" class="file-name"></div>
            <div id="file-meta" class="file-meta"></div>
          </div>
          <button id="replace-file" class="button button-link" type="button">Choose another</button>
        </div>

        <div class="ppi-control">
          <label for="ppi-input">Image PPI</label>
          <div class="ppi-input-row">
            <input id="ppi-input" type="number" min="1" max="600" step="1" value="600" inputmode="numeric" aria-describedby="ppi-range" />
            <span class="ppi-unit">PPI</span>
          </div>
          <div class="preset-row" role="group" aria-label="PPI presets">
            <button class="preset-button" type="button" data-ppi="72">72</button>
            <button class="preset-button" type="button" data-ppi="96">96</button>
            <button class="preset-button" type="button" data-ppi="150">150</button>
            <button class="preset-button" type="button" data-ppi="200">200</button>
            <button class="preset-button" type="button" data-ppi="300">300</button>
            <button class="preset-button active" type="button" data-ppi="600">600</button>
            <span id="ppi-range" class="ppi-range">Range: 1–600</span>
          </div>
        </div>

        <div id="status-panel" class="status-panel hidden" aria-live="polite" aria-atomic="true">
          <div class="status-topline">
            <span id="status-label">Ready</span>
            <span id="status-percent">0%</span>
          </div>
          <div id="progress-track" class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Conversion progress">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <div id="status-detail" class="status-detail"></div>
        </div>

        <div class="action-row">
          <button id="convert-button" class="button button-primary" type="button" disabled>Convert to PPTX</button>
          <button id="download-button" class="button button-primary button-download hidden" type="button">Download PPTX</button>
          <button id="notes-button" class="button button-outline hidden" type="button">Add notes</button>
          <button id="cancel-button" class="button button-outline hidden" type="button">Cancel</button>
          <button id="reset-button" class="button button-link hidden" type="button">Reset</button>
        </div>

        <div id="notes-panel" class="notes-panel hidden">
          <label for="notes-input">Slide notes (Markdown)</label>
          <textarea
            id="notes-input"
            rows="8"
            spellcheck="false"
            placeholder="## page: 1&#10;Note for page 1&#10;&#10;## page: 3&#10;Note for page 3"
          ></textarea>
          <p class="notes-help">Use one <code>## page: N</code> section per PDF page. Page numbers start at 1.</p>
          <div id="notes-file-error" class="notes-file-error hidden" role="alert"></div>
          <div class="notes-actions">
            <button id="apply-notes-button" class="button button-primary" type="button">Apply notes</button>
            <button id="cancel-notes-button" class="button button-link" type="button">Cancel</button>
          </div>
        </div>

        <div id="message" class="message hidden" role="status"></div>
      </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
